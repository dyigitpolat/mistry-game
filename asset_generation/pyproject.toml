[project]
name = "mistry-asset-generation"
version = "0.1.0"
description = "Python asset generation backend for Mistry game"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-ai>=0.8.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "huggingface-hub>=0.29.0",
  "pillow>=10.3.0",
  "rembg>=2.0.59",
  "onnxruntime>=1.18.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

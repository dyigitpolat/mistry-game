[project]
name = "mistry-agents"
version = "0.1.0"
description = "Mistry Whodunit — Multi-Agent Engine (deepagents SDK)"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.1.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "google-genai>=1.0.0",
    "langfuse>=2.0.0",
]

[project.optional-dependencies]
mistral = ["langchain-mistralai>=0.2.0"]
gemini = ["langchain-google-genai>=2.0.0"]
huggingface = ["langchain-huggingface>=0.1.0"]
all-providers = [
    "langchain-mistralai>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-huggingface>=0.1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

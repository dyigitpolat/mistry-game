[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "procedural-gen"
version = "0.1.0"
description = "Procedural generation of whodunnit mystery stories from user inputs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.19.0",
    "pyarrow>=16.0.0",
    "huggingface-hub",
    "ipykernel>=7.2.0",
    "jinja2>=3.1.0",
    "matplotlib>=3.10.8",
    "mistralai>=1.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
procedural-gen = "cli.main:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src", "cli"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
